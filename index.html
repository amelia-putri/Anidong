<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniDong</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-neutral-900 text-white min-h-screen">

  <h1 class="text-center text-2xl font-bold mt-6">AniDong</h1>

  <!-- HERO -->
  <div class="max-w-3xl mx-auto mt-6 p-5 rounded-xl bg-gradient-to-r from-red-500 to-purple-600">
    <h2 class="text-xl font-bold">Nonton Donghua & Anime Sub Indo</h2>
    <p class="text-sm mt-1">Streaming cepat & gratis</p>
  </div>

  <div class="max-w-md mx-auto px-4 mb-6">
  <input
    id="search"
    type="text"
    placeholder="Cari anime..."
    class="w-full p-3 rounded bg-neutral-800 text-white outline-none"
  >
</div>

  <!-- LIST -->
  <div
    id="list"
    class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 mt-10 px-6"
  ></div>

  <script src="assets/js/main.js"></script>
</body>
</html>
