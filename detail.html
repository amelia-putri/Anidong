<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Anime</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS UTAMA -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .status {
      display: inline-block;
      background: #ff7a00;
      color: #000;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 16px;
    }

    /* PLAYER */
    .player-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .player-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* EPISODE */
    .episode-title {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .episode-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .episode-list::-webkit-scrollbar {
      height: 6px;
    }

    .episode-list::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 10px;
    }

    .episode-item {
      min-width: 70px;
      text-align: center;
      padding: 10px 0;
      background: #1a1a1a;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
    }

    .episode-item.active {
      background: #ff7a00;
      color: #000;
      font-weight: bold;
    }

    .episode-info {
      margin-top: 12px;
      background: #1a1a1a;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- JUDUL -->
    <h1 id="animeTitle">Pertempuran Menembus Langit</h1>
    <div class="status">Sedang berlangsung</div>

    <!-- PLAYER -->
    <div class="player-wrapper">
      <iframe
        id="videoPlayer"
        src=""
        allowfullscreen
        allow="autoplay; fullscreen">
      </iframe>
    </div>

    <!-- EPISODE LIST -->
    <div class="episode-title">Daftar Episode</div>
    <div id="episodeList" class="episode-list"></div>

    <div class="episode-info">
      Seri yang sedang berlangsung
    </div>

  </div>

  <!-- JS -->
  <script src="js/detail.js"></script>
</body>
</html>
