<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Watch Episode</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">

  <div class="max-w-4xl mx-auto p-4">
    <a href="javascript:history.back()" class="text-purple-400">← Kembali</a>

    <h1 id="title" class="text-xl font-bold mt-4"></h1>
    <p id="episode" class="text-sm text-gray-400 mb-4"></p>

    <div class="aspect-video">
      <iframe id="player"
        class="w-full h-full rounded"
        allowfullscreen
        allow="autoplay"
      ></iframe>
    </div>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
document.getElementById("title").innerText = params.get("title");
document.getElementById("episode").innerText = "Episode " + params.get("ep");
document.getElementById("player").src = params.get("url");
</script>

</body>
</html>
