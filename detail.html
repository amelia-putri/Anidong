<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Anime | AniDong</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
    }

    /* HEADER */
    header {
      padding: 15px 25px;
      background: #000;
      border-bottom: 1px solid #222;
    }

    header a {
      color: orange;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
    }

    /* CONTAINER */
    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-top: 10px;
    }

    /* PLAYER */
    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
    }

    .player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* EPISODE LIST */
    .episode-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .episode-list button {
      background: #222;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .episode-list button.active {
      background: orange;
      color: #000;
      font-weight: bold;
    }

    .episode-list button:hover {
      background: #333;
    }
  </style>
</head>

<body>

<!-- HEADER / LOGO -->
<header>
  <a href="index.html">AniDong</a>
</header>

<div class="container">
  <h1 id="animeTitle">Loading...</h1>

  <!-- PLAYER -->
  <div class="player">
    <iframe id="videoPlayer" allowfullscreen></iframe>
  </div>

  <!-- EPISODE -->
  <h3>Daftar Episode</h3>
  <div class="episode-list" id="episodeList"></div>
</div>

<script src="js/detail.js"></script>
</body>
</html>
