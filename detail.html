<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Anime</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-neutral-900 text-white min-h-screen p-6">

  <a href="index.html" class="text-sm text-purple-400">← Kembali</a>

  <div id="detail" class="max-w-4xl mx-auto mt-6"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    fetch("data/anime.json")
      .then(res => res.json())
      .then(data => {
        const anime = data.find(a => a.id == id);

        if (!anime) {
          document.getElementById("detail").innerHTML =
            "<p>Anime tidak ditemukan</p>";
          return;
        }

        document.getElementById("detail").innerHTML = `
          <img src="${anime.cover}" class="w-full max-h-96 object-cover rounded-xl mb-6">

          <h1 class="text-2xl font-bold mb-2">${anime.title}</h1>
          <p class="text-gray-400 mb-4">${anime.episodes.length} Episode</p>

          <div class="space-y-2">
            ${[...anime.episodes].reverse().map(ep => 
  <a href="watch.html?title=${encodeURIComponent(anime.title)}&ep=${ep.episode}&url=${encodeURIComponent(ep.url)}"
     class="block bg-neutral-800 hover:bg-purple-600 transition p-3 rounded">
    Episode ${ep.episode}
  </a>
`).join("")}

          </div>
        `;
      });
  </script>

</body>
</html>
