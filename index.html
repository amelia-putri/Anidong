<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Battle Through the Heavens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- PLAYER -->
<div class="player-section">
  <div class="player-wrapper">
    <iframe id="videoPlayer" allowfullscreen></iframe>
  </div>

  <!-- SERVER -->
  <div class="server-bar">
    <select id="serverSelect"></select>
  </div>

  <!-- NAV -->
  <div class="nav-bar">
    <button id="prevEp">‹</button>
    <button id="listBtn">☰</button>
    <button id="nextEp">›</button>
  </div>
</div>

<!-- INFO ANIME -->
<div class="anime-info">
  <img src="cover.jpg">
  <div>
    <h2>Battle Through the Heavens</h2>
    <p><span class="ongoing">Ongoing</span> · Episode <span id="currentEp"></span></p>
  </div>
</div>

<!-- LIST EPISODE -->
<div class="episode-container" id="episodeList"></div>

<script src="assets/js/app.js"></script>
</body>
</html>
