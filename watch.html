<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Watch Episode</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">

  <div class="max-w-4xl mx-auto p-4">
    <a href="javascript:history.back()" class="text-purple-400">← Kembali</a>

    <h1 id="title" class="text-xl font-bold mt-4"></h1>
    <p id="episode" class="text-sm text-gray-400 mb-4"></p>

    <div class="aspect-video">
      <iframe id="player"
        class="w-full h-full rounded"
        allowfullscreen
        allow="autoplay"
      ></iframe>
    </div>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const title = params.get("title");
const currentEp = parseInt(params.get("ep"));
const videoUrl = params.get("url");

document.getElementById("title").innerText = title;
document.getElementById("episode").innerText = "Episode " + currentEp;

const player = document.getElementById("player");
player.src = videoUrl;

// ambil data anime
fetch("data/anime.json")
  .then(res => res.json())
  .then(data => {
    const anime = data.find(a => a.title === title);
    if (!anime) return;

    const episodes = [...anime.episodes].sort((a, b) => a.episode - b.episode);
    const index = episodes.findIndex(ep => ep.episode === currentEp);
    const nextEp = episodes[index + 1];

    if (!nextEp) return; // episode terakhir

    // AUTO NEXT EPISODE
    player.addEventListener("ended", () => {
      window.location.href =
        `watch.html?title=${encodeURIComponent(title)}&ep=${nextEp.episode}&url=${encodeURIComponent(nextEp.url)}`;
    });
  });
</script>


</body>
</html>
